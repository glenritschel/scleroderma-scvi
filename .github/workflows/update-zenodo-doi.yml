name: Update Zenodo DOI in docs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to patch (e.g., v0.1.7). Leave blank to use the release tag."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  update-doi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # 1) Resolve tag + fetch DOI (never fail). Exposes outputs: found, doi, tag
      - name: Fetch Zenodo DOI (by concept or release URL)
        id: fetch
        env:
          TAG_INPUT: ${{ github.event.inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}   # e.g., glenritschel/scleroderma-scvi
          CONCEPT_SECRET: ${{ secrets.ZENODO_CONCEPT_DOI }}
          CONCEPT_VAR: ${{ vars.ZENODO_CONCEPT_DOI }}
        run: |
          python - <<'PY'
          import os, json, time, urllib.request, urllib.parse

          def q(url):
              with urllib.request.urlopen(url) as r:
                  return json.load(r)

          # resolve tag
          tag = os.environ.get("TAG_INPUT") or ""
          if not tag and os.environ.get("EVENT_NAME") == "release":
              with open(os.environ["GITHUB_EVENT_PATH"]) as f:
                  tag = json.load(f).get("release", {}).get("tag_name", "")

          repo = os.environ.get("REPO","")
          concept = os.environ.get("CONCEPT_SECRET") or os.environ.get("CONCEPT_VAR") or ""

          if not tag or not repo:
              print("::notice ::Missing tag or repo"); 
              open(os.environ["GITHUB_OUTPUT"],"a").write("found=false\ndoi=\n"); 
              raise SystemExit(0)

          # candidates: with and without 'v'
          versions = [v for v in {tag, tag.lstrip('v')} if v]

          # 1) try by concept (if known)
          urls = []
          if concept:
              core = f'conceptdoi:{concept}+AND+(' + " OR ".join(f'metadata.version:"{v}"' for v in versions) + ")"
              urls.append("https://zenodo.org/api/records/?size=50&q=" + urllib.parse.quote(core))

          # 2) fall back to searching by the GitHub release URL (isSupplementTo / related_identifiers)
          rel_urls = [
              f"https://github.com/{repo}/releases/tag/{tag}",
              f"https://github.com/{repo}/releases/tag/{tag.lstrip('v')}",
          ]
          for u in rel_urls:
              core = f'metadata.related_identifiers.identifier:"{u}"'
              urls.append("https://zenodo.org/api/records/?size=50&q=" + urllib.parse.quote(core))

          def find(tries=20):
              sleep = 10
              for i in range(tries):
                  for url in urls:
                      data = q(url)
                      hits = data.get("hits", {}).get("hits", [])
                      if hits:
                          # newest first
                          hits.sort(key=lambda h: h.get("updated",""), reverse=True)
                          return hits[0]
                  print(f"Zenodo record not found yet (attempt {i+1}/{tries}); sleeping {sleep}s...")
                  time.sleep(sleep)
                  sleep = min(sleep*1.5, 30)
              return None

          rec = find()
          doi = rec.get("doi") if rec else ""
          with open(os.environ["GITHUB_OUTPUT"],"a") as fh:
              fh.write(f"found={'true' if bool(doi) else 'false'}\n")
              fh.write(f"doi={doi}\n")
              fh.write(f"tag={tag}\n")
          if doi:
              # print concept so you can store it for future runs
              conceptdoi = rec.get("conceptdoi") or rec.get("conceptdoi", "")
              if conceptdoi:
                  print("Concept DOI:", conceptdoi)
              print("Found DOI:", doi)
          PY

      # 2) Patch files only if a DOI was found
      - name: Patch CITATION.cff and README.md
        if: steps.fetch.outputs.found == 'true'
        env:
          DOI: ${{ steps.fetch.outputs.doi }}
          TAG: ${{ steps.fetch.outputs.tag }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          try:
              import yaml
          except ImportError:
              import sys, subprocess
              subprocess.check_call([sys.executable, "-m", "pip", "install", "pyyaml"])
              import yaml

          doi = os.environ["DOI"]
          tag = os.environ.get("TAG") or ""

          # CITATION.cff
          cff_p = Path("CITATION.cff")
          if cff_p.exists():
              cff = yaml.safe_load(cff_p.read_text(encoding="utf-8")) or {}
              ids = [i for i in (cff.get("identifiers") or []) if isinstance(i, dict)]
              vals = {i.get("value") for i in ids}
              if doi not in vals:
                  ids.append({"type": "doi", "value": doi})
              cff["identifiers"] = ids
              if tag and not cff.get("version"):
                  cff["version"] = tag
              from datetime import date
              if not cff.get("date-released"):
                  cff["date-released"] = date.today().isoformat()
              cff_p.write_text(yaml.safe_dump(cff, sort_keys=False), encoding="utf-8")
              print("Patched CITATION.cff")
          else:
              print("CITATION.cff not found; skipping.")

          # README.md
          rd = Path("README.md")
          txt = rd.read_text(encoding="utf-8") if rd.exists() else "# README\n\n"
          if re.search(r"DOI:\s*10\.\d{4,9}/\S+", txt):
              txt = re.sub(r"(DOI:\s*)10\.\d{4,9}/\S+", rf"\g<1>{doi}", txt)
          else:
              txt += f"\n\n**Citation**: DOI: {doi}\n"
          rd.write_text(txt, encoding="utf-8")
          print("Patched README.md")
          PY

      # 3) Open PR (only when patched)
      - name: Create PR
        if: steps.fetch.outputs.found == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          title: "Add Zenodo DOI to CITATION/README for ${{ steps.fetch.outputs.tag }}"
          branch: update-doi-${{ steps.fetch.outputs.tag }}
          commit-message: "Add Zenodo DOI for ${{ steps.fetch.outputs.tag }}"
          body: "Adds the minted Zenodo DOI to CITATION.cff and README."
