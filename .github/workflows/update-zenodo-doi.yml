name: Update Zenodo DOI in docs

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-doi:
    runs-on: ubuntu-latest
    env:
      ZENODO_BASE: https://zenodo.org
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Find Zenodo record and patch files
        env:
          TAG: ${{ github.event.release.tag_name }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: python scripts/doi_patch.py

      - name: Open PR
        if: ${{ github.event.release.tag_name != '' }}
        uses: peter-evans/create-pull-request@v6
        with:
          title: Add Zenodo DOI to CITATION/README for ${{ github.event.release.tag_name }}
          branch: update-doi-${{ github.event.release.tag_name }}
          body: PR adds the minted Zenodo DOI to CITATION.cff and README (derived from the GitHub release URL).
