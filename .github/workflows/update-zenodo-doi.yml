name: Update Zenodo DOI in docs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v0.1.14). Leave blank to use the event tag."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  update-doi:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Runner already has Python, but this keeps versions consistent
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run DOI updater
        env:
          # For 'release' events TAG is set; for manual runs, we pass inputs.tag
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/find_zenodo_and_patch.py

      - name: Open PR
        if: ${{ success() }}
        uses: peter-evans/create-pull-request@v6
        with:
          title: Add Zenodo DOI to CITATION/README for ${{ github.event.release.tag_name || inputs.tag }}
          branch: update-doi-${{ github.event.release.tag_name || inputs.tag }}
          base: ${{ github.event.repository.default_branch }}
          body: PR adds the minted Zenodo DOI to CITATION.cff and README (from the GitHub release URL / version).
