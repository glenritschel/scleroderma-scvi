name: Update Zenodo DOI in docs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v0.1.14)"
        required: true
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  update-doi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Find Zenodo record and patch files
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          # If 'release' event, this will be set; for workflow_dispatch, INPUT_TAG will be set.
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
import os, re, sys, time, json, urllib.parse, urllib.request, subprocess, pathlib

owner = os.environ.get("OWNER")
repo  = os.environ.get("REPO")
tag   = os.environ.get("TAG") or os.environ.get("INPUT_TAG") or os.environ.get("GITHUB_REF_NAME")
if not tag:
    print("::error ::No tag provided or detected.")
    sys.exit(1)

release_url = f"https://github.com/{owner}/{repo}/releases/tag/{tag}"
print(f"Looking for Zenodo record referencing: {release_url}")

def zenodo_get(url):
    with urllib.request.urlopen(url) as r:
        return json.load(r)

def search_by_related_url(url):
    q = f'metadata.related_identifiers.identifier:"{url}"'
    u = f'https://zenodo.org/api/records/?q={urllib.parse.quote(q)}&size=3&sort=mostrecent'
    return zenodo_get(u).get("hits",{}).get("hits",[])

def search_by_version(version):
    # Try with and without leading 'v'
    versions = {version.lstrip(), version.lstrip('v')}
    hits=[]
    for v in versions:
        if not v: 
            continue
        q = f'metadata.version:"{v}" AND metadata.creators.name:*'  # version must match; creators present
        u = f'https://zenodo.org/api/records/?q={urllib.parse.quote(q)}&size=3&sort=mostrecent'
        hits.extend(zenodo_get(u).get("hits",{}).get("hits",[]))
    return hits

# Poll up to ~20 minutes with gentle backoff
attempts = 40        # 40 * ~30s avg ≈ 20 min
sleep_seq = []       # start at 15s and drift up to ~45s
for i in range(attempts):
    # 1) Prefer exact relation by release URL
    hits = search_by_related_url(release_url)
    # 2) Fallback by version string if needed (handles slow relation indexing)
    if not hits:
        hits = search_by_version(tag)
    if hits:
        rec = hits[0]
        doi = rec.get("doi")
        conceptdoi = rec.get("conceptdoi") or rec.get("metadata",{}).get("conceptdoi")
        print(f"Found DOI: {doi}")
        print(f"Concept DOI: {conceptdoi}")

        def patch(path, pattern, repl, flags=re.M):
            p = pathlib.Path(path)
            if not p.exists():
                return False
            txt = p.read_text(encoding="utf-8")
            new = re.sub(pattern, repl, txt, flags=flags)
            if new != txt:
                p.write_text(new, encoding="utf-8")
                return True
            return False

        changed = False

        # CITATION.cff: ensure identifiers include the version DOI
        p_cff = pathlib.Path("CITATION.cff")
        if p_cff.exists():
            txt = p_cff.read_text(encoding="utf-8")
            if "identifiers:" in txt:
                if re.search(r'(?ms)-\s*type:\s*doi\s*\n\s*value:\s*".*?"', txt):
                    changed |= patch("CITATION.cff",
                                     r'(?ms)(-\s*type:\s*doi\s*\n\s*value:\s*).*',
                                     r'\1"'+doi+'"')
                else:
                    changed |= patch("CITATION.cff",
                                     r'(?ms)(identifiers:\s*(?:-.*\n)*)$',
                                     r'\1- type: doi\n  value: "'+doi+'"\n')
            else:
                with open("CITATION.cff","a",encoding="utf-8") as f:
                    f.write(f'\nidentifiers:\n- type: doi\n  value: "{doi}"\n')
                changed = True

        # README.md: update or append a DOI line
        p_md = pathlib.Path("README.md")
        if p_md.exists():
            txt = p_md.read_text(encoding="utf-8")
            if "DOI:" in txt:
                changed |= patch("README.md", r'(DOI:\s*)(\S+)', r'\1'+doi)
            else:
                with open("README.md","a",encoding="utf-8") as f:
                    f.write(f'\n\n**DOI:** {doi}\n')
                changed = True

        if not changed:
            print("::notice ::No file changes needed.")
            sys.exit(0)

        subprocess.check_call(["git","config","user.name","doi-bot"])
        subprocess.check_call(["git","config","user.email","doi-bot@users.noreply.github.com"])
        branch = f"update-doi-{tag}"
        subprocess.check_call(["git","checkout","-b", branch])
        subprocess.check_call(["git","add","CITATION.cff","README.md"])
        subprocess.check_call(["git","commit","-m", f"Add Zenodo DOI for {tag}: {doi}"])
        subprocess.check_call(["git","push","origin","HEAD"])
        print("::notice ::Pushed branch with DOI update.")
        sys.exit(0)

    wait = 15 + min(i, 30)  # start 15s, creep up to ~45s
    print(f"Zenodo record not found yet (attempt {i+1}/{attempts}); sleeping {wait}s...")
    time.sleep(wait)

print("::warning ::No Zenodo record found after extended wait; exiting neutral.")
sys.exit(78)
PY

      - name: Open PR
        if: ${{ success() }}
        uses: peter-evans/create-pull-request@v6
        with:
          title: Add Zenodo DOI to CITATION/README for ${{ github.event.release.tag_name || inputs.tag }}
          branch: update-doi-${{ github.event.release.tag_name || inputs.tag }}
          body: PR adds the minted Zenodo DOI to CITATION.cff and README (derived from the GitHub release URL).
