name: Update Zenodo DOI in docs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to patch (e.g., v0.1.7)"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-doi:
    # only run for release or manual dispatch
    if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get Zenodo DOI and patch files
        env:
          ZENODO_CONCEPT_DOI: ${{ secrets.ZENODO_CONCEPT_DOI }}   # set this secret once
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        run: |
          python - <<'PY'
import os, sys, time, re, json, urllib.request
from urllib.error import HTTPError
from pathlib import Path
try:
    import yaml
except ImportError:
    import subprocess; subprocess.check_call([sys.executable,"-m","pip","install","pyyaml"]); import yaml

tag = os.environ.get("TAG")
concept = os.environ.get("ZENODO_CONCEPT_DOI")
if not tag or not concept:
    print("Missing TAG or ZENODO_CONCEPT_DOI"); sys.exit(78)  # neutral

def fetch_record(concept, tag, tries=10, sleep=20):
    q = f"https://zenodo.org/api/records/?q=conceptdoi:{concept}+AND+metadata.version:{tag}"
    for i in range(tries):
        try:
            with urllib.request.urlopen(q) as r: data = json.load(r)
            hits = data.get("hits",{}).get("hits",[])
            if hits: 
                hits.sort(key=lambda h: h.get("updated",""), reverse=True)
                return hits[0]
        except HTTPError as e:
            if 500 <= e.code < 600: pass
        print(f"Zenodo record not found yet (attempt {i+1}/{tries}); sleeping {sleep}s...")
        time.sleep(sleep)
    return None

rec = fetch_record(concept, tag)
if not rec:
    print("No Zenodo record found yet; exiting neutral."); sys.exit(78)

doi = rec.get("doi") or rec.get("metadata",{}).get("prereserve_doi",{}).get("doi")
if not doi:
    print("DOI missing; exiting neutral."); sys.exit(78)
print("Found DOI:", doi)

# Patch CITATION.cff (dedupe)
cff_p = Path("CITATION.cff")
if not cff_p.exists():
    print("CITATION.cff not found; neutral."); sys.exit(78)
cff = yaml.safe_load(cff_p.read_text()) or {}
ids = [i for i in (cff.get("identifiers") or []) if isinstance(i, dict)]
vals = {i.get("value") for i in ids}
if doi not in vals: ids.append({"type":"doi","value":doi})
cff["identifiers"] = ids
cff_p.write_text(yaml.safe_dump(cff, sort_keys=False))

# Patch README (replace or add)
rd = Path("README.md")
txt = rd.read_text() if rd.exists() else "# README\n\n"
if re.search(r"DOI:\s*10\.\d{4,9}/\S+", txt):
    txt = re.sub(r"(DOI:\s*)10\.\d{4,9}/\S+", rf"\g<1>{doi}", txt)
else:
    txt += f"\n\n**Citation**: DOI: {doi}\n"
rd.write_text(txt)
PY

      - name: Create PR
        uses: peter-evans/create-pull-request@v6
        with:
          title: "Add Zenodo DOI to CITATION/README for ${{ inputs.tag || github.event.release.tag_name }}"
          branch: update-doi-${{ inputs.tag || github.event.release.tag_name }}
          commit-message: "Add Zenodo DOI for ${{ inputs.tag || github.event.release.tag_name }}"
          body: "Adds the minted Zenodo DOI to CITATION.cff and README."
