name: Update Zenodo DOI in docs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to patch (e.g., v0.1.7)"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-doi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # ----- 1) Look up DOI (never fail). Writes outputs: found=true|false, doi=... -----
      - name: Fetch Zenodo DOI
        id: fetch
        env:
          CONCEPT: ${{ secrets.ZENODO_CONCEPT_DOI }}                 # your concept DOI (repo secret)
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        run: |
          python - <<'PY'
import os, json, time, urllib.request
from urllib.error import HTTPError

concept = os.environ.get("CONCEPT")
tag = os.environ.get("TAG") or ""
if not concept or not tag:
    print("::notice ::Missing concept DOI secret or tag; skipping.")
    found, doi = False, ""
else:
    def fetch(concept, tag, tries=10, sleep=20):
        q = f"https://zenodo.org/api/records/?q=conceptdoi:{concept}+AND+metadata.version:{tag}"
        for i in range(tries):
            try:
                with urllib.request.urlopen(q) as r:
                    data = json.load(r)
                hits = data.get("hits",{}).get("hits",[])
                if hits:
                    hits.sort(key=lambda h: h.get("updated",""), reverse=True)
                    return hits[0]
            except HTTPError as e:
                if 500 <= e.code < 600:
                    pass
            print(f"Zenodo record not found yet (attempt {i+1}/{tries}); sleeping {sleep}s...")
            time.sleep(sleep)
        return None

    rec = fetch(concept, tag)
    if not rec:
        print("::notice ::No Zenodo record found yet; skipping for now.")
        found, doi = False, ""
    else:
        doi = rec.get("doi") or rec.get("metadata",{}).get("prereserve_doi",{}).get("doi","")
        if doi:
            print(f"Found DOI: {doi}")
            found = True
        else:
            print("::notice ::DOI field missing in record; skipping.")
            found = False
            doi = ""

# write GITHUB_OUTPUT
out = os.environ["GITHUB_OUTPUT"]
with open(out, "a") as fh:
    fh.write(f"found={'true' if found else 'false'}\n")
    fh.write(f"doi={doi}\n")
PY

      # ----- 2) Patch files only if a DOI was found -----
      - name: Patch CITATION.cff and README.md
        if: steps.fetch.outputs.found == 'true'
        env:
          DOI: ${{ steps.fetch.outputs.doi }}
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        run: |
          python - <<'PY'
import os, re
from pathlib import Path
try:
    import yaml
except ImportError:
    import sys, subprocess
    subprocess.check_call([sys.executable, "-m", "pip", "install", "pyyaml"])
    import yaml

doi = os.environ["DOI"]
tag = os.environ.get("TAG") or ""

# CITATION.cff
cff_p = Path("CITATION.cff")
if not cff_p.exists():
    print("::notice ::CITATION.cff not found; skipping patch.")
else:
    cff = yaml.safe_load(cff_p.read_text(encoding="utf-8")) or {}
    ids = [i for i in (cff.get("identifiers") or []) if isinstance(i, dict)]
    vals = {i.get("value") for i in ids}
    if doi not in vals:
        ids.append({"type":"doi","value":doi})
    cff["identifiers"] = ids
    if tag:
        cff.setdefault("version", tag)
    from datetime import date
    cff.setdefault("date-released", date.today().isoformat())
    cff_p.write_text(yaml.safe_dump(cff, sort_keys=False), encoding="utf-8")
    print("Patched CITATION.cff")

# README.md
rd = Path("README.md")
txt = rd.read_text(encoding="utf-8") if rd.exists() else "# README\n\n"
if re.search(r"DOI:\s*10\.\d{4,9}/\S+", txt):
    txt = re.sub(r"(DOI:\s*)10\.\d{4,9}/\S+", rf"\g<1>{doi}", txt)
else:
    txt += f"\n\n**Citation**: DOI: {doi}\n"
rd.write_text(txt, encoding="utf-8")
print("Patched README.md")
PY

      # ----- 3) Open PR (only when we patched files) -----
      - name: Create PR
        if: steps.fetch.outputs.found == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          title: "Add Zenodo DOI to CITATION/README for ${{ github.event.inputs.tag || github.event.release.tag_name }}"
          branch: update-doi-${{ github.event.inputs.tag || github.event.release.tag_name }}
          commit-message: "Add Zenodo DOI for ${{ github.event.inputs.tag || github.event.release.tag_name }}"
          body: "Adds the minted Zenodo DOI to CITATION.cff and README."
